<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Skyline at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101c2b"/>
      <stop offset="45%" stop-color="#26414f"/>
      <stop offset="78%" stop-color="#6d8272"/>
      <stop offset="100%" stop-color="#c8b394"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22333f"/>
      <stop offset="100%" stop-color="#33474f"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a22"/>
      <stop offset="100%" stop-color="#1b2a33"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f0b878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0b878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="640" r="300" fill="url(#sun)"/>
  <circle cx="1180" cy="648" r="62" fill="#ffe3b5" opacity="0.85"/>

  <!-- far skyline -->
  <g fill="url(#far)" opacity="0.9">
    <rect x="60" y="470" width="120" height="430" rx="6"/>
    <rect x="205" y="540" width="90" height="360" rx="6"/>
    <rect x="320" y="420" width="140" height="480" rx="8"/>
    <rect x="485" y="520" width="105" height="380" rx="6"/>
    <rect x="915" y="500" width="130" height="400" rx="6"/>
    <rect x="1070" y="560" width="95" height="340" rx="6"/>
    <rect x="1330" y="450" width="150" height="450" rx="8"/>
    <rect x="1500" y="540" width="100" height="360" rx="6"/>
  </g>

  <!-- near blocks -->
  <g fill="url(#near)">
    <rect x="0" y="610" width="230" height="290" rx="10"/>
    <rect x="255" y="665" width="200" height="235" rx="10"/>
    <rect x="600" y="565" width="260" height="335" rx="12"/>
    <rect x="1150" y="620" width="240" height="280" rx="10"/>
    <rect x="1410" y="680" width="190" height="220" rx="10"/>
  </g>

  <!-- windows -->
  <g fill="#ffd79a" opacity="0.55">
    <rect x="640" y="600" width="18" height="26" rx="3"/>
    <rect x="676" y="600" width="18" height="26" rx="3"/>
    <rect x="712" y="600" width="18" height="26" rx="3"/>
    <rect x="640" y="652" width="18" height="26" rx="3"/>
    <rect x="712" y="652" width="18" height="26" rx="3"/>
    <rect x="784" y="600" width="18" height="26" rx="3"/>
    <rect x="784" y="652" width="18" height="26" rx="3"/>
    <rect x="40" y="650" width="18" height="26" rx="3"/>
    <rect x="76" y="650" width="18" height="26" rx="3"/>
    <rect x="40" y="702" width="18" height="26" rx="3"/>
    <rect x="1190" y="660" width="18" height="26" rx="3"/>
    <rect x="1226" y="660" width="18" height="26" rx="3"/>
    <rect x="1190" y="712" width="18" height="26" rx="3"/>
    <rect x="1300" y="660" width="18" height="26" rx="3"/>
  </g>

  <!-- ground haze -->
  <rect x="0" y="820" width="1600" height="80" fill="#0b1319" opacity="0.55"/>
</svg>
