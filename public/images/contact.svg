<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Houses at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="55%" stop-color="#16242a"/>
      <stop offset="100%" stop-color="#2c4038"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16222a"/>
      <stop offset="100%" stop-color="#0d151b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe0b4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9fe0b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <circle cx="400" cy="300" r="380" fill="url(#glow)"/>
  <circle cx="1260" cy="220" r="52" fill="#e8f1e6" opacity="0.75"/>

  <!-- stars -->
  <g fill="#e8f1e6" opacity="0.5">
    <circle cx="180" cy="130" r="2.5"/><circle cx="320" cy="90" r="2"/>
    <circle cx="520" cy="160" r="2.5"/><circle cx="700" cy="100" r="2"/>
    <circle cx="880" cy="180" r="2.5"/><circle cx="1040" cy="120" r="2"/>
    <circle cx="1420" cy="150" r="2.5"/><circle cx="1520" cy="260" r="2"/>
  </g>

  <!-- ridge -->
  <path d="M0 620 L220 540 L430 600 L640 520 L860 590 L1080 530 L1320 600 L1600 545 L1600 900 L0 900 Z" fill="#132026" opacity="0.85"/>

  <!-- houses -->
  <g fill="url(#house)">
    <path d="M240 700 L380 600 L520 700 L520 880 L240 880 Z"/>
    <path d="M620 720 L760 620 L900 720 L900 880 L620 880 Z"/>
    <path d="M1000 690 L1150 580 L1300 690 L1300 880 L1000 880 Z"/>
  </g>

  <!-- lit windows -->
  <g fill="#ffd79a" opacity="0.8">
    <rect x="300" y="720" width="34" height="44" rx="5"/>
    <rect x="420" y="720" width="34" height="44" rx="5"/>
    <rect x="356" y="800" width="46" height="80" rx="5" fill="#ffc987"/>
    <rect x="682" y="740" width="34" height="44" rx="5"/>
    <rect x="800" y="740" width="34" height="44" rx="5"/>
    <rect x="736" y="815" width="46" height="65" rx="5" fill="#ffc987"/>
    <rect x="1062" y="705" width="34" height="44" rx="5"/>
    <rect x="1190" y="705" width="34" height="44" rx="5"/>
    <rect x="1122" y="790" width="46" height="90" rx="5" fill="#ffc987"/>
  </g>

  <rect x="0" y="840" width="1600" height="60" fill="#070c10" opacity="0.6"/>
</svg>
